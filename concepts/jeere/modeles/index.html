<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Modèle · Jehre</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- A model's demo, inside Jehre (jehre.com/modeles/<modèle>/). It asks for an account: a visitor who is not
       logged in is sent to the sign-up, and comes back to this very model once her account is open. The model
       itself is shown in a frame under Jehre's bar, with « Choisir ce modèle ». Asset paths start at / (the page is
       served at /modeles/<modèle>/ by vercel.json). -->
  <script>
    (function () {
      var m = /\/modeles\/(anse|seve|soyeuse|michou|regard|vernie|minuit)\//.exec(location.pathname);
      window.JEHRE_MODEL = m ? m[1] : '';
      var acc = null;
      try { acc = JSON.parse(localStorage.getItem('jeere-account') || 'null'); } catch (e) { acc = null; }
      var open = false;
      try { open = !!(acc && acc.loggedIn && acc.userId && localStorage.getItem('sb-aezchxfvzfoqlvzchqyk-auth-token')); } catch (e) { open = false; }
      window.JEHRE_OPEN = open;
      // no model named: the list of the models is in the dashboard (which asks for the account too)
      if (!m) { location.replace(open ? '/admin/#boutique' : '/compte/#inscription'); return; }
      if (!open) location.replace('/compte/?suite=modele&m=' + m[1] + (acc ? '#connexion' : '#inscription'));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/rainbow.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; background: #F5F5F3; color: #111111; font: 400 15px/1.4 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .mv-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: #FFFFFF; border-bottom: 1px solid rgba(17, 17, 17, .12); }
    .mv-logo { flex: none; display: inline-flex; }
    .mv-logo svg { height: 30px; width: auto; display: block; }
    .mv-name { flex: 1; min-width: 0; display: grid; }
    .mv-name b { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mv-name span { color: #5E5E5E; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mv-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 14px; white-space: nowrap; }
    .mv-all { color: #3D3D3D; font-weight: 500; }
    .mv-all:hover { background: #F5F5F3; }
    .mv-frame { flex: 1; min-height: 0; width: 100%; border: 0; background: #FFFFFF; }
    @media (max-width: 560px) { .mv-all { display: none; } .mv-bar { padding-left: 12px; padding-right: 12px; gap: 10px; } .mv-btn { padding: 0 12px; } }
  </style>
</head>
<body>
  <header class="mv-bar">
    <a class="mv-logo" href="/admin/" aria-label="Jehre, tableau de bord">
      <svg viewBox="0 0 600 446" role="img" aria-label="Jehre"><use href="#cloud"/></svg>
    </a>
    <p class="mv-name" style="margin:0"><b id="mv-title">Modèle</b><span id="mv-kind"></span></p>
    <a class="mv-btn mv-all" href="/admin/#boutique">Tous les modèles</a>
    <a class="mv-btn jr-rainbow" id="mv-choose" href="/admin/#boutique">Choisir ce modèle</a>
  </header>
  <iframe class="mv-frame" id="mv-frame" title="Aperçu du modèle"></iframe>

  <script src="/creer/models.js"></script>
  <script>
    (function () {
      var slug = window.JEHRE_MODEL;
      if (!slug || !window.JEHRE_OPEN) return;
      var M = window.JeereModels, m = null;
      try { m = M && M.bySlug ? M.bySlug(slug) : null; } catch (e) { m = null; }
      var name = (m && m.name) || slug.toUpperCase();
      document.title = 'Modèle ' + name + ' · Jehre';
      document.getElementById('mv-title').textContent = 'Modèle ' + name;
      if (m && m.kind) document.getElementById('mv-kind').textContent = m.kind;
      document.getElementById('mv-choose').href = '/admin/#boutique/modele/' + slug;
      document.getElementById('mv-frame').src = '/modeles/voir/' + slug + '/';
      // the logo, the same drawing as everywhere (taken from the account page's sprite)
      fetch('/compte/index.html').then(function (r) { return r.text(); }).then(function (t) {
        var s = /<symbol id="cloud"[\s\S]*?<\/symbol>/.exec(t);
        if (!s) return;
        var d = document.createElement('div');
        d.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' + s[0] + '</svg>';
        document.body.insertBefore(d.firstChild, document.body.firstChild);
      }).catch(function () { /* the bar works without the mark */ });
    })();
  </script>
</body>
</html>
