<rect width="800" height="860" fill="#ececea"/>
<defs><g id="precharge"><path d="M300 300 q100 -20 210 0 l26 372 q2 22 -20 24 q-120 14 -232 0 q-22 -2 -20 -24z" fill="url(#pouchrecharge)"/>
