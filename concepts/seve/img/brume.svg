<rect width="800" height="860" fill="#ececea"/>
<defs><g id="pbrume"><rect x="330" y="350" width="140" height="330" rx="18" fill="url(#glassbrume)"/>
<rect x="334" y="420" width="132" height="256" rx="14" fill="url(#liquidbrume)"/>
<rect x="342" y="370" width="10" height="280" rx="5" fill="#ffffff" opacity=".13"/><rect x="358" y="380" width="4" height="260" rx="4" fill="#ffffff" opacity=".07"/>
<rect x="362" y="300" width="76" height="56" rx="6" fill="url(#blackbrume)"/>
<rect x="374" y="244" width="52" height="60" rx="10" fill="url(#blackbrume)"/>
<circle cx="380" cy="268" r="4" fill="#3a3a3a"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#e9e4c8" text-anchor="middle">
  <text x="400" y="440" font-size="9.9" letter-spacing="1.4" font-weight="600">BRUME</text>
  <text x="400" y="454.4" font-size="7.7" letter-spacing=".6" opacity=".8">D'oreiller · lavande</text>
  <text x="400" y="503.0" font-size="27.0" letter-spacing="6.3" font-weight="400">SÈVE</text>
  <text x="400" y="557.0" font-size="6.8" letter-spacing="2.0" font-weight="600" opacity=".9">DÉTEND · ENDORT</text>
</g>
<text x="344" y="664" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#e9e4c8" opacity=".7">100 ml</text></g></defs>
<g transform="translate(400 430) scale(1.18) translate(-400 -430)"><g transform="translate(62 46)" opacity=".9">
  <use xlink:href="#pbrume" href="#pbrume" filter="url(#shbrume)"/>
</g>
<ellipse cx="462" cy="570" rx="120" ry="70" fill="url(#glowbrume)" opacity=".55" filter="url(#softbrume)"/>
<use xlink:href="#pbrume" href="#pbrume"/></g>
</svg>