<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 860" width="800" height="860">
<defs>
  <linearGradient id="glassbrume" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#141a0a"/><stop offset=".18" stop-color="#2f3b14"/>
    <stop offset=".5" stop-color="#4f5e1d"/><stop offset=".78" stop-color="#2c3712"/><stop offset="1" stop-color="#10150a"/>
  </linearGradient>
  <linearGradient id="glassLbrume" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#3d4a13"/><stop offset=".2" stop-color="#6f7f24"/>
    <stop offset=".5" stop-color="#9aa83a"/><stop offset=".8" stop-color="#5f6e1e"/><stop offset="1" stop-color="#2d3810"/>
  </linearGradient>
  <linearGradient id="blackbrume" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#0b0b0b"/><stop offset=".35" stop-color="#2a2a2a"/><stop offset=".6" stop-color="#161616"/><stop offset="1" stop-color="#060606"/>
  </linearGradient>
  <linearGradient id="pouchbrume" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#7c8a2e"/><stop offset=".55" stop-color="#5d6b20"/><stop offset="1" stop-color="#3f4a15"/>
  </linearGradient>
  <linearGradient id="liquidbrume" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#b9b84a" stop-opacity=".0"/><stop offset=".25" stop-color="#c4c35a" stop-opacity=".35"/><stop offset="1" stop-color="#8f8f2a" stop-opacity=".25"/>
  </linearGradient>
  <radialGradient id="glowbrume" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#d7d36a" stop-opacity=".75"/><stop offset="1" stop-color="#9aa040" stop-opacity="0"/>
  </radialGradient>
  <filter id="shbrume" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="#3a4020" flood-opacity=".4"/><feComposite in2="SourceAlpha" operator="in"/><feGaussianBlur stdDeviation="2.2"/>
  </filter>
  <filter id="softbrume"><feGaussianBlur stdDeviation="14"/></filter>
