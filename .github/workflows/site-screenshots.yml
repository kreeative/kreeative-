# Refreshes the screenshots in the "Websites" section of the home page.
# Run it from the Actions tab (workflow_dispatch) whenever one of the sites
# changes; it commits the new images back to the branch it was run on.
name: Site screenshots
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these sites, e.g. "tabouret" (leave empty for all)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.47.2 sharp
      - run: npx playwright install --with-deps chromium
      - run: node tools/site-screenshots.mjs
        env:
          ONLY: ${{ inputs.only }}
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/sites index.html websites
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh site screenshots"
          git push
