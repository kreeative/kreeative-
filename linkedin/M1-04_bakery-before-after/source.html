<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M1-04 · The Bakery wordmark: two details that carry it.</title>
<link rel="stylesheet" href="../_shared/kee.css">
<style>@page { size: 1080px 1350px; margin: 0; }</style>
</head>
<body>
<section class="page">
  <div class="vl"></div><div class="ht"></div><div class="hb"></div>
  <img class="mark" src="../../assets/img/logo-512.webp" alt="">
  <div class="sig">Kee · Kreeative</div>
  <div class="area">
    <p class="kicker">Logo · The Bakery</p>
    <h2 class="t-2">The Bakery wordmark: <em>two details</em> that carry it.</h2>
    <p class="body">A baguette for the B, a cupcake for the e.</p>
    
    <div class="visual"><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;width:100%;height:100%">
      <div style="display:flex;flex-direction:column;gap:16px"><p class="cap">The wordmark</p><img class="photo" src="../../assets/img/project-bakery-1000.webp" alt="" style="object-position:40% 50%"></div>
      <div style="display:flex;flex-direction:column;gap:16px"><p class="cap">On the packaging</p><img class="photo" src="../../assets/img/case-bakery-2-1000.webp" alt=""></div></div></div>
  </div>
  <div class="foot"><span>Logo · The Bakery</span><span>kreeative.xyz</span></div>
</section>
<script>
  // Scale each visual down to the space left under the text, so nothing runs into the footer.
  document.fonts.ready.then(() => document.querySelectorAll('.visual').forEach(v => {
    const c = v.firstElementChild; if (!c) return;
    const s = Math.min(1, v.clientHeight / c.offsetHeight, v.clientWidth / c.offsetWidth);
    if (s < 1) c.style.transform = 'scale(' + s.toFixed(3) + ')';
  }));
</script>
</body>
</html>
