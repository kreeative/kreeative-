<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M1-09 · Designing a web app people want to open every day.</title>
<link rel="stylesheet" href="../_shared/kee.css">
<style>@page { size: 1080px 1350px; margin: 0; }</style>
</head>
<body>
<section class="page">
  <div class="vl"></div><div class="ht"></div><div class="hb"></div>
  <img class="mark" src="../../assets/img/logo-512.webp" alt="">
  <div class="sig">Kee · Kreeative</div>
  <div class="area">
    <p class="kicker">Product design · Rich &amp; Friends</p>
    <h2 class="t-2">Designing a web app people want to <em>open every day.</em></h2>
    
    
    <div class="visual"><div style="display:flex;gap:26px;align-items:flex-start;justify-content:center;width:100%">
      <div class="stack"><div class="phone" style="width:290px;height:657px"><div class="scr"><div style="height:100%;background:#fff5f7;padding-top:50px"><img src="../_shared/img/rf/goals.webp" alt="" style="width:100%;display:block"></div></div><div class="sbar"><span>9:41</span><span class="sbi"><i></i><i></i><i></i><b></b></span></div><i class="island"></i><i class="homebar"></i></div><p class="phone-cap"><strong>Goals</strong>one question a day</p></div>
      <div class="stack"><div class="phone" style="width:290px;height:657px"><div class="scr"><div style="height:100%;background:#fff5f7;padding-top:50px"><img src="../_shared/img/rf/home.webp" alt="" style="width:100%;display:block"></div></div><div class="sbar"><span>9:41</span><span class="sbi"><i></i><i></i><i></i><b></b></span></div><i class="island"></i><i class="homebar"></i></div><p class="phone-cap"><strong>Home</strong>your day in one place</p></div>
      <div class="stack"><div class="phone" style="width:290px;height:657px"><div class="scr"><div style="height:100%;background:#fff5f7;padding-top:50px"><img src="../_shared/img/rf/board.webp" alt="" style="width:100%;display:block"></div></div><div class="sbar"><span>9:41</span><span class="sbi"><i></i><i></i><i></i><b></b></span></div><i class="island"></i><i class="homebar"></i></div><p class="phone-cap"><strong>Board</strong>the group, side by side</p></div></div></div>
  </div>
  <div class="foot"><span>Product design · Rich & Friends</span><span>kreeative.xyz</span></div>
</section>
<script>
  // Scale each visual down to the space left under the text, so nothing runs into the footer.
  document.fonts.ready.then(() => document.querySelectorAll('.visual').forEach(v => {
    const c = v.firstElementChild; if (!c) return;
    const s = Math.min(1, v.clientHeight / c.offsetHeight, v.clientWidth / c.offsetWidth);
    if (s < 1) c.style.transform = 'scale(' + s.toFixed(3) + ')';
  }));
</script>
</body>
</html>
