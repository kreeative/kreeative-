<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M2-02 · Make belief look undeniable.</title>
<link rel="stylesheet" href="../_shared/kee.css">
<style>@page { size: 1080px 1350px; margin: 0; }</style>
</head>
<body>
<section class="page">
  <div class="vl"></div><div class="ht"></div><div class="hb"></div>
  <img class="mark" src="../../assets/img/logo-512.webp" alt="">
  <div class="sig">Kee · Kreeative</div>
  <div class="area">
    <p class="kicker">Before / after · GloryWalk</p>
    <h2 class="t-2">Make belief look <em>undeniable.</em></h2>
    <p class="body">What changed: <span class="ph">[WHAT_CHANGED_GLORYWALK]</span></p>
    
    <div class="visual"><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;width:100%;height:100%">
      <div style="display:flex;flex-direction:column;gap:16px"><p class="cap">Before</p><div class="phbox">[GLORYWALK_BEFORE]<small>The brand before the new identity</small></div></div>
      <div style="display:flex;flex-direction:column;gap:16px"><p class="cap">After</p><img class="photo" src="../../assets/img/project-glorywalk-1000.webp" alt=""></div></div></div>
  </div>
  <div class="foot"><span>Before / after · GloryWalk</span><span>kreeative.xyz</span></div>
</section>
<script>
  // Scale each visual down to the space left under the text, so nothing runs into the footer.
  document.fonts.ready.then(() => document.querySelectorAll('.visual').forEach(v => {
    const c = v.firstElementChild; if (!c) return;
    const s = Math.min(1, v.clientHeight / c.offsetHeight, v.clientWidth / c.offsetWidth);
    if (s < 1) c.style.transform = 'scale(' + s.toFixed(3) + ')';
  }));
</script>
</body>
</html>
